name: App RES gestão (Android)

# Gera o RES.apk (Capacitor) e publica na release "gestao-latest".
# O app só carrega o site: tudo o que mudar no RES aparece sem atualizar o APK.
# Assina com a mesma chave do app do motoboy (segredos MOTOBOY_KEYSTORE_*), para atualizar por cima.
on:
  push:
    branches: [main]
    paths:
      - 'apps-mobile/painel/**'
      - '.github/workflows/painel-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        working-directory: apps-mobile/painel
        run: npm install --no-audit --no-fund
      - name: Gerar projeto Android
        working-directory: apps-mobile/painel
        run: |
          npx cap add android
          npx cap sync android
          node scripts/ajustar-android.mjs
      - name: Chave de assinatura
        working-directory: apps-mobile/painel/android/app
        env:
          KS_B64: ${{ secrets.MOTOBOY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MOTOBOY_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > res.keystore
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KS_ALIAS=motoboy" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore res.keystore -alias res -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=RES, O=RES, C=BR"
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "KS_ALIAS=res" >> "$GITHUB_ENV"
            echo "::warning::Sem chave guardada: APK assinado com chave nova (para instalar uma versão nova do APK, desinstale a antiga)."
          fi
      - name: Compilar APK
        working-directory: apps-mobile/painel/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RES.apk"
          ls -la "$GITHUB_WORKSPACE/RES.apk"
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gestao-latest >/dev/null 2>&1 || gh release create gestao-latest --title "RES (Android)" \
            --notes "Abra este link no celular, baixe RES.apk e instale (permita instalar apps desta fonte). Entre com o seu usuário e senha do RES. O app abre o RES de sempre: as atualizações chegam sozinhas." --latest=false
          gh release upload gestao-latest RES.apk --clobber

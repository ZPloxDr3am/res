# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
project_id = "res"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 16

[realtime]
enabled = true

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirmar"]

[auth.email]
enable_signup = true
enable_confirmations = false
